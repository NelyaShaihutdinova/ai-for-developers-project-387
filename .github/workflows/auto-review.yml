name: auto-review

run-name: "#${{ github.event.pull_request.number }} - auto-review"

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Только доверенные авторы, только свой репозиторий
    if: >-
      github.event.pull_request.author_association != 'NONE' &&
      github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      MAX_RUNS: 3
      TARGET_ID: ${{ github.event.pull_request.number }}
      WORKFLOW_FILE: auto-review.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authenticate gh CLI
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Check run limit
        id: limit
        run: |
          # Get current run ID to exclude it from the count
          CURRENT_RUN_ID=${{ github.run_id }}

          # Count completed runs for this PR (excluding current run)
          RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs \
            --jq ".workflow_runs[] | select(.conclusion != \"\" and .conclusion != null and .id != $CURRENT_RUN_ID) | .display_title" \
            | grep -c "#${TARGET_ID}" || true)

          echo "completed_runs=$RUNS" >> $GITHUB_OUTPUT
          echo "max_runs=$MAX_RUNS" >> $GITHUB_OUTPUT

          if [ "$RUNS" -ge "$MAX_RUNS" ]; then
            echo "limit_exceeded=true" >> $GITHUB_OUTPUT

            # Get the last completed run for this PR (excluding current)
            LAST_ID=$(gh api repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs \
              --jq "[.workflow_runs[] | select(.conclusion != \"\" and .conclusion != null and .id != $CURRENT_RUN_ID and (.display_title | contains(\"#${TARGET_ID}\")))] | last | .id")

            if [ -n "$LAST_ID" ] && [ "$LAST_ID" != "null" ]; then
              CONCLUSION=$(gh api repos/${{ github.repository }}/actions/runs/$LAST_ID --jq '.conclusion')
              LAST_SHA=$(gh api repos/${{ github.repository }}/actions/runs/$LAST_ID --jq '.head_sha')
              RUN_ID=$LAST_ID

              if [ "$CONCLUSION" = "cancelled" ]; then
                REASON="timeout"
              elif [ "$CONCLUSION" = "failure" ]; then
                # Check if it's infra error
                LOGS=$(gh run view $RUN_ID --log-failed 2>/dev/null || true)
                if echo "$LOGS" | grep -qiE "OIDC|ACTIONS_ID_TOKEN|OPENCODE_API_KEY|secret|key|infra"; then
                  REASON="infra"
                else
                  REASON="agent_failed"
                fi
              else
                REASON="agent_failed"
              fi
            else
              REASON="limit_exhausted"
              LAST_SHA=""
              RUN_ID=""
            fi

            echo "reason=$REASON" >> $GITHUB_OUTPUT
            echo "last_sha=$LAST_SHA" >> $GITHUB_OUTPUT
            echo "last_run_id=$RUN_ID" >> $GITHUB_OUTPUT
          else
            echo "limit_exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish limit exhausted
        if: steps.limit.outputs.limit_exceeded == 'true'
        run: |
          REASON="${{ steps.limit.outputs.reason }}"
          LAST_SHA="${{ steps.limit.outputs.last_sha }}"
          RUN_ID="${{ steps.limit.outputs.last_run_id }}"
          PR_NUMBER="${{ env.TARGET_ID }}"
          REPO="${{ github.repository }}"

          MSG="⛔ **Agent run limit exhausted** (${{ steps.limit.outputs.completed_runs }}/${{ env.MAX_RUNS }})\n\n"
          MSG+="**Reason**: \`$REASON\`\n"
          MSG+="**Last SHA**: \`$LAST_SHA\`\n"
          if [ -n "$RUN_ID" ]; then
            MSG+="**Logs**: https://github.com/$REPO/actions/runs/$RUN_ID\n"
          fi
          MSG+="\nNo more model calls will be made for this PR."

          gh pr comment $PR_NUMBER --body "$MSG"

      - name: Run review agent
        if: steps.limit.outputs.limit_exceeded != 'true'
        uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # v2.0
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/qwen3.6-plus
          share: 'true'
          use_github_token: 'true'
          prompt: >
            Ты — агент-ревьюер для Pull Request #${{ github.event.pull_request.number }}.

            Инструкции:
            1. Прочитай файл REVIEW.md — это чек-лист критериев проверки календаря бронирований
            2. Проанализируй изменения в PR (diff, затронутые файлы)
            3. Проверь по каждому разделу REVIEW.md: что выполнено, что упущено
            4. Оставь развёрнутый комментарий-ревью с результатами:
               - Какие критерии пройдены
               - Какие критерии требуют доработки
               - Найденные проблемы (баги, утечки секретов, отсутствие тестов)
            5. Если PR не соответствует REVIEW.md, отметь конкретные пункты и предложи исправления

            НЕ модифицируй код. Только анализируй и комментируй.
            Используй REVIEW.md как основной источник требований.
