##########################################################################
#                    OpenCode Agent Workflow                             #
#                                                                        #
# Triggered by /opencode or /oc in issue/PR comments.                    #
# Only trusted collaborators can invoke it. Forks do NOT get secrets.   #
##########################################################################

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      (
        contains(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        startsWith(github.event.comment.body, '/oc')
      ) &&
      github.event.comment.author_association != 'NONE' &&
      github.event.comment.user.type != 'Bot'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authenticate gh CLI
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@2410593023d2c61f05123c9b0faf189a28dfbeee # v2.0
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/qwen3.6-plus
          mentions: /opencode,/oc
          share: 'true'
          use-github-token: 'true'
